name: Build Flet app

on:
  push:
    branches: [main]     # сборка при каждом пуше в main
    tags: ["v*"]         # сборка + релиз при создании тега, например v1.0.0
  workflow_dispatch:      # ручной запуск кнопкой во вкладке Actions

permissions:
  contents: write         # нужно, чтобы выложить файлы в Releases

jobs:
  build:
    strategy:
      fail-fast: false    # если одна ОС упала, остальные всё равно соберутся
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-24.04      # не ubuntu-latest: на 26.04 не компилируется Python-заголовок
            target: linux
    runs-on: ${{ matrix.os }}

    env:
      # Windows-консоль в cp1252 не умеет рисовать индикатор flet build
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      FLET_CLI_NO_RICH_OUTPUT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libmpv-dev mpv

      - name: Install Flet
        run: pip install "flet==0.28.3"

      - name: Build
        run: flet build ${{ matrix.target }} --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

  release:
    # выкладываем в Releases только при сборке по тегу
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          cd artifacts
          for d in app-*; do
            (cd "$d" && zip -r -q "../${d}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip